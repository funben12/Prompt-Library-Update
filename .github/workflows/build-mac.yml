name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install py2app

      - name: Build .icns from app-icon.png
        run: |
          mkdir mac/icon.iconset
          sips -z 16 16     app-icon.png --out mac/icon.iconset/icon_16x16.png
          sips -z 32 32     app-icon.png --out mac/icon.iconset/icon_16x16@2x.png
          sips -z 32 32     app-icon.png --out mac/icon.iconset/icon_32x32.png
          sips -z 64 64     app-icon.png --out mac/icon.iconset/icon_32x32@2x.png
          sips -z 128 128   app-icon.png --out mac/icon.iconset/icon_128x128.png
          sips -z 256 256   app-icon.png --out mac/icon.iconset/icon_128x128@2x.png
          sips -z 256 256   app-icon.png --out mac/icon.iconset/icon_256x256.png
          sips -z 512 512   app-icon.png --out mac/icon.iconset/icon_256x256@2x.png
          sips -z 512 512   app-icon.png --out mac/icon.iconset/icon_512x512.png
          cp app-icon.png mac/icon.iconset/icon_512x512@2x.png
          iconutil -c icns mac/icon.iconset -o mac/app-icon.icns

      - name: Build .app with py2app
        run: python3 mac/setup.py py2app

      - name: Create .dmg
        run: |
          mkdir dist_dmg
          cp -R "dist/Prompt Library Pro.app" dist_dmg/
          hdiutil create -volname "Prompt Library Pro" \
            -srcfolder dist_dmg -ov -format UDZO \
            "Prompt Library Pro.dmg"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: PromptLibraryPro-app
          path: dist/Prompt Library Pro.app

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: PromptLibraryPro-dmg
          path: Prompt Library Pro.dmg
