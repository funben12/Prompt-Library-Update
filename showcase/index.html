<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Library Pro screens</title>
<style>
:root { --bg: oklch(93.5% 0.01 70); --surface: oklch(95.2% 0.008 70); --line: oklch(84% 0.014 70); --ink: oklch(18% 0.04 260); --ink-3: oklch(50% 0.02 260); --accent: oklch(38% 0.14 190); --on-accent: white; }
:root[data-theme="dark"] { --bg: oklch(16% 0.012 70); --surface: oklch(20% 0.014 70); --line: oklch(30% 0.016 70); --ink: oklch(94% 0.01 70); --ink-3: oklch(68% 0.012 70); --accent: oklch(74% 0.13 190); --on-accent: oklch(16% 0.012 70); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Instrument Sans", "Segoe UI", system-ui, sans-serif; line-height: 1.5; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 40px 16px 8px; max-width: 1400px; margin: 0 auto; }
h1 { margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: clamp(28px, 4vw, 44px); letter-spacing: -0.01em; line-height: 1.1; }
header p { margin: 8px 0 0; color: var(--ink-3); max-width: 60ch; }
.num { font-family: "JetBrains Mono", Consolas, monospace; font-size: 0.8em; color: var(--ink-3); margin-right: 8px; }
.switch { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.switch button { border: 0; background: transparent; color: var(--ink-3); font: inherit; font-weight: 600; font-size: 14px; padding: 8px 18px; border-radius: 999px; cursor: pointer; }
.switch button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
main { max-width: 1400px; margin: 0 auto; padding: 0 16px 64px; }
h2 { margin: 40px 0 16px; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }
h2 .num { margin: 0 0 0 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 24px 16px; }
figure { margin: 0; }
figure button { display: block; width: 100%; padding: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); cursor: zoom-in; }
figure button:focus-visible, .switch button:focus-visible, dialog button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
figure img { display: block; width: 100%; height: auto; }
figcaption { padding: 10px 4px 0; font-size: 14px; font-weight: 600; }
dialog { width: min(96vw, 1500px); padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); }
dialog::backdrop { background: oklch(15% 0.012 75 / 0.7); }
dialog img { display: block; width: 100%; height: auto; }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; font-weight: 600; font-size: 14px; }
.bar div { display: flex; gap: 6px; }
.bar button { border: 1px solid var(--line); background: transparent; color: var(--ink); font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Prompt Library Pro</h1>
    <p><span class="num">50</span>screens from the desktop app, captured at 1440 by 900 with sample prompts. Click any screen to enlarge. Arrow keys move between screens.</p>
  </div>
  <div class="switch" role="group" aria-label="Theme">
    <button type="button" data-theme="light" aria-pressed="true">Light</button>
    <button type="button" data-theme="dark" aria-pressed="false">Dark</button>
  </div>
</header>
<main><section><h2>Core screens <span class="num">8</span></h2><div class="grid"><figure><button type="button" data-file="01-library-list.jpg" aria-label="Open Library, list view"><img loading="lazy" src="light/01-library-list.jpg" alt="Library, list view" width="1440" height="900"></button><figcaption><span class="num">01</span>Library, list view</figcaption></figure><figure><button type="button" data-file="02-library-grid.jpg" aria-label="Open Library, grid view"><img loading="lazy" src="light/02-library-grid.jpg" alt="Library, grid view" width="1440" height="900"></button><figcaption><span class="num">02</span>Library, grid view</figcaption></figure><figure><button type="button" data-file="03-prompt-detail.jpg" aria-label="Open Prompt detail panel"><img loading="lazy" src="light/03-prompt-detail.jpg" alt="Prompt detail panel" width="1440" height="900"></button><figcaption><span class="num">03</span>Prompt detail panel</figcaption></figure><figure><button type="button" data-file="04-prompt-editor.jpg" aria-label="Open Prompt editor"><img loading="lazy" src="light/04-prompt-editor.jpg" alt="Prompt editor" width="1440" height="900"></button><figcaption><span class="num">04</span>Prompt editor</figcaption></figure><figure><button type="button" data-file="05-command-palette.jpg" aria-label="Open Command palette"><img loading="lazy" src="light/05-command-palette.jpg" alt="Command palette" width="1440" height="900"></button><figcaption><span class="num">05</span>Command palette</figcaption></figure><figure><button type="button" data-file="06-api-settings.jpg" aria-label="Open API settings"><img loading="lazy" src="light/06-api-settings.jpg" alt="API settings" width="1440" height="900"></button><figcaption><span class="num">06</span>API settings</figcaption></figure><figure><button type="button" data-file="07-analytics.jpg" aria-label="Open Analytics"><img loading="lazy" src="light/07-analytics.jpg" alt="Analytics" width="1440" height="900"></button><figcaption><span class="num">07</span>Analytics</figcaption></figure><figure><button type="button" data-file="08-workspaces-launcher.jpg" aria-label="Open Workspaces launcher"><img loading="lazy" src="light/08-workspaces-launcher.jpg" alt="Workspaces launcher" width="1440" height="900"></button><figcaption><span class="num">08</span>Workspaces launcher</figcaption></figure></div></section><section><h2>Prompt Board <span class="num">6</span></h2><div class="grid"><figure><button type="button" data-file="09-prompt-board-home.jpg" aria-label="Open Prompt Board, home feed"><img loading="lazy" src="light/09-prompt-board-home.jpg" alt="Prompt Board, home feed" width="1440" height="900"></button><figcaption><span class="num">09</span>Prompt Board, home feed</figcaption></figure><figure><button type="button" data-file="10-prompt-board-hover-save.jpg" aria-label="Open Prompt Board, hover to save"><img loading="lazy" src="light/10-prompt-board-hover-save.jpg" alt="Prompt Board, hover to save" width="1440" height="900"></button><figcaption><span class="num">10</span>Prompt Board, hover to save</figcaption></figure><figure><button type="button" data-file="11-prompt-board-close-up.jpg" aria-label="Open Prompt Board, pin close up"><img loading="lazy" src="light/11-prompt-board-close-up.jpg" alt="Prompt Board, pin close up" width="1440" height="900"></button><figcaption><span class="num">11</span>Prompt Board, pin close up</figcaption></figure><figure><button type="button" data-file="12-prompt-board-boards.jpg" aria-label="Open Prompt Board, boards"><img loading="lazy" src="light/12-prompt-board-boards.jpg" alt="Prompt Board, boards" width="1440" height="900"></button><figcaption><span class="num">12</span>Prompt Board, boards</figcaption></figure><figure><button type="button" data-file="13-prompt-board-single-board.jpg" aria-label="Open Prompt Board, one board"><img loading="lazy" src="light/13-prompt-board-single-board.jpg" alt="Prompt Board, one board" width="1440" height="900"></button><figcaption><span class="num">13</span>Prompt Board, one board</figcaption></figure><figure><button type="button" data-file="14-save-to-board-popover.jpg" aria-label="Open Save to board from the library"><img loading="lazy" src="light/14-save-to-board-popover.jpg" alt="Save to board from the library" width="1440" height="900"></button><figcaption><span class="num">14</span>Save to board from the library</figcaption></figure></div></section><section><h2>Workspaces <span class="num">34</span></h2><div class="grid"><figure><button type="button" data-file="15-workspace-prompt-generator.jpg" aria-label="Open Prompt Generator"><img loading="lazy" src="light/15-workspace-prompt-generator.jpg" alt="Prompt Generator" width="1440" height="900"></button><figcaption><span class="num">15</span>Prompt Generator</figcaption></figure><figure><button type="button" data-file="16-workspace-meta-prompting.jpg" aria-label="Open Meta Prompting"><img loading="lazy" src="light/16-workspace-meta-prompting.jpg" alt="Meta Prompting" width="1440" height="900"></button><figcaption><span class="num">16</span>Meta Prompting</figcaption></figure><figure><button type="button" data-file="17-workspace-prompt-forge.jpg" aria-label="Open Prompt Forge"><img loading="lazy" src="light/17-workspace-prompt-forge.jpg" alt="Prompt Forge" width="1440" height="900"></button><figcaption><span class="num">17</span>Prompt Forge</figcaption></figure><figure><button type="button" data-file="18-workspace-prompt-components.jpg" aria-label="Open Prompt Components"><img loading="lazy" src="light/18-workspace-prompt-components.jpg" alt="Prompt Components" width="1440" height="900"></button><figcaption><span class="num">18</span>Prompt Components</figcaption></figure><figure><button type="button" data-file="19-workspace-prompt-chain.jpg" aria-label="Open Prompt Chain"><img loading="lazy" src="light/19-workspace-prompt-chain.jpg" alt="Prompt Chain" width="1440" height="900"></button><figcaption><span class="num">19</span>Prompt Chain</figcaption></figure><figure><button type="button" data-file="20-workspace-agents.jpg" aria-label="Open Agents"><img loading="lazy" src="light/20-workspace-agents.jpg" alt="Agents" width="1440" height="900"></button><figcaption><span class="num">20</span>Agents</figcaption></figure><figure><button type="button" data-file="21-workspace-prompt-from-example.jpg" aria-label="Open Prompt From Example"><img loading="lazy" src="light/21-workspace-prompt-from-example.jpg" alt="Prompt From Example" width="1440" height="900"></button><figcaption><span class="num">21</span>Prompt From Example</figcaption></figure><figure><button type="button" data-file="22-workspace-prompt-optimizer.jpg" aria-label="Open Prompt Optimizer"><img loading="lazy" src="light/22-workspace-prompt-optimizer.jpg" alt="Prompt Optimizer" width="1440" height="900"></button><figcaption><span class="num">22</span>Prompt Optimizer</figcaption></figure><figure><button type="button" data-file="23-workspace-prompt-splicer.jpg" aria-label="Open Prompt Splicer"><img loading="lazy" src="light/23-workspace-prompt-splicer.jpg" alt="Prompt Splicer" width="1440" height="900"></button><figcaption><span class="num">23</span>Prompt Splicer</figcaption></figure><figure><button type="button" data-file="24-workspace-prompt-lab.jpg" aria-label="Open Prompt Lab"><img loading="lazy" src="light/24-workspace-prompt-lab.jpg" alt="Prompt Lab" width="1440" height="900"></button><figcaption><span class="num">24</span>Prompt Lab</figcaption></figure><figure><button type="button" data-file="25-workspace-model-adapter.jpg" aria-label="Open Model Adapter"><img loading="lazy" src="light/25-workspace-model-adapter.jpg" alt="Model Adapter" width="1440" height="900"></button><figcaption><span class="num">25</span>Model Adapter</figcaption></figure><figure><button type="button" data-file="26-workspace-prompt-simplifier.jpg" aria-label="Open Prompt Simplifier"><img loading="lazy" src="light/26-workspace-prompt-simplifier.jpg" alt="Prompt Simplifier" width="1440" height="900"></button><figcaption><span class="num">26</span>Prompt Simplifier</figcaption></figure><figure><button type="button" data-file="27-workspace-tone-and-style-rewriter.jpg" aria-label="Open Tone and Style Rewriter"><img loading="lazy" src="light/27-workspace-tone-and-style-rewriter.jpg" alt="Tone and Style Rewriter" width="1440" height="900"></button><figcaption><span class="num">27</span>Tone and Style Rewriter</figcaption></figure><figure><button type="button" data-file="28-workspace-prompt-translator.jpg" aria-label="Open Prompt Translator"><img loading="lazy" src="light/28-workspace-prompt-translator.jpg" alt="Prompt Translator" width="1440" height="900"></button><figcaption><span class="num">28</span>Prompt Translator</figcaption></figure><figure><button type="button" data-file="29-workspace-gauntlet-loop.jpg" aria-label="Open Gauntlet Loop"><img loading="lazy" src="light/29-workspace-gauntlet-loop.jpg" alt="Gauntlet Loop" width="1440" height="900"></button><figcaption><span class="num">29</span>Gauntlet Loop</figcaption></figure><figure><button type="button" data-file="30-workspace-prompt-ide.jpg" aria-label="Open Prompt IDE"><img loading="lazy" src="light/30-workspace-prompt-ide.jpg" alt="Prompt IDE" width="1440" height="900"></button><figcaption><span class="num">30</span>Prompt IDE</figcaption></figure><figure><button type="button" data-file="31-workspace-prompt-forking.jpg" aria-label="Open Prompt Forking"><img loading="lazy" src="light/31-workspace-prompt-forking.jpg" alt="Prompt Forking" width="1440" height="900"></button><figcaption><span class="num">31</span>Prompt Forking</figcaption></figure><figure><button type="button" data-file="32-workspace-prompt-surgeon.jpg" aria-label="Open Prompt Surgeon"><img loading="lazy" src="light/32-workspace-prompt-surgeon.jpg" alt="Prompt Surgeon" width="1440" height="900"></button><figcaption><span class="num">32</span>Prompt Surgeon</figcaption></figure><figure><button type="button" data-file="33-workspace-ai-teammate-studio.jpg" aria-label="Open AI Teammate Studio"><img loading="lazy" src="light/33-workspace-ai-teammate-studio.jpg" alt="AI Teammate Studio" width="1440" height="900"></button><figcaption><span class="num">33</span>AI Teammate Studio</figcaption></figure><figure><button type="button" data-file="34-workspace-prompt-red-team.jpg" aria-label="Open Prompt Red Team"><img loading="lazy" src="light/34-workspace-prompt-red-team.jpg" alt="Prompt Red Team" width="1440" height="900"></button><figcaption><span class="num">34</span>Prompt Red Team</figcaption></figure><figure><button type="button" data-file="35-workspace-prompt-auditor.jpg" aria-label="Open Prompt Auditor"><img loading="lazy" src="light/35-workspace-prompt-auditor.jpg" alt="Prompt Auditor" width="1440" height="900"></button><figcaption><span class="num">35</span>Prompt Auditor</figcaption></figure><figure><button type="button" data-file="36-workspace-prompt-x-ray.jpg" aria-label="Open Prompt X-Ray"><img loading="lazy" src="light/36-workspace-prompt-x-ray.jpg" alt="Prompt X-Ray" width="1440" height="900"></button><figcaption><span class="num">36</span>Prompt X-Ray</figcaption></figure><figure><button type="button" data-file="37-workspace-diff-lens.jpg" aria-label="Open Diff Lens"><img loading="lazy" src="light/37-workspace-diff-lens.jpg" alt="Diff Lens" width="1440" height="900"></button><figcaption><span class="num">37</span>Diff Lens</figcaption></figure><figure><button type="button" data-file="38-workspace-cost-lens.jpg" aria-label="Open Cost Lens"><img loading="lazy" src="light/38-workspace-cost-lens.jpg" alt="Cost Lens" width="1440" height="900"></button><figcaption><span class="num">38</span>Cost Lens</figcaption></figure><figure><button type="button" data-file="39-workspace-library-organizer.jpg" aria-label="Open Library Organizer"><img loading="lazy" src="light/39-workspace-library-organizer.jpg" alt="Library Organizer" width="1440" height="900"></button><figcaption><span class="num">39</span>Library Organizer</figcaption></figure><figure><button type="button" data-file="40-workspace-quick-fill.jpg" aria-label="Open Quick Fill"><img loading="lazy" src="light/40-workspace-quick-fill.jpg" alt="Quick Fill" width="1440" height="900"></button><figcaption><span class="num">40</span>Quick Fill</figcaption></figure><figure><button type="button" data-file="41-workspace-playground.jpg" aria-label="Open Playground"><img loading="lazy" src="light/41-workspace-playground.jpg" alt="Playground" width="1440" height="900"></button><figcaption><span class="num">41</span>Playground</figcaption></figure><figure><button type="button" data-file="42-workspace-batch-runner.jpg" aria-label="Open Batch Runner"><img loading="lazy" src="light/42-workspace-batch-runner.jpg" alt="Batch Runner" width="1440" height="900"></button><figcaption><span class="num">42</span>Batch Runner</figcaption></figure><figure><button type="button" data-file="43-workspace-model-compare.jpg" aria-label="Open Model Compare"><img loading="lazy" src="light/43-workspace-model-compare.jpg" alt="Model Compare" width="1440" height="900"></button><figcaption><span class="num">43</span>Model Compare</figcaption></figure><figure><button type="button" data-file="44-workspace-run-history.jpg" aria-label="Open Run History"><img loading="lazy" src="light/44-workspace-run-history.jpg" alt="Run History" width="1440" height="900"></button><figcaption><span class="num">44</span>Run History</figcaption></figure><figure><button type="button" data-file="45-workspace-backup-and-restore.jpg" aria-label="Open Backup and Restore"><img loading="lazy" src="light/45-workspace-backup-and-restore.jpg" alt="Backup and Restore" width="1440" height="900"></button><figcaption><span class="num">45</span>Backup and Restore</figcaption></figure><figure><button type="button" data-file="46-workspace-version-lock.jpg" aria-label="Open Version Lock"><img loading="lazy" src="light/46-workspace-version-lock.jpg" alt="Version Lock" width="1440" height="900"></button><figcaption><span class="num">46</span>Version Lock</figcaption></figure><figure><button type="button" data-file="47-workspace-integrity-check.jpg" aria-label="Open Integrity Check"><img loading="lazy" src="light/47-workspace-integrity-check.jpg" alt="Integrity Check" width="1440" height="900"></button><figcaption><span class="num">47</span>Integrity Check</figcaption></figure><figure><button type="button" data-file="48-workspace-credential-vault.jpg" aria-label="Open Credential Vault"><img loading="lazy" src="light/48-workspace-credential-vault.jpg" alt="Credential Vault" width="1440" height="900"></button><figcaption><span class="num">48</span>Credential Vault</figcaption></figure></div></section><section><h2>More screens <span class="num">2</span></h2><div class="grid"><figure><button type="button" data-file="49-context-bank.jpg" aria-label="Open Context Bank"><img loading="lazy" src="light/49-context-bank.jpg" alt="Context Bank" width="1440" height="900"></button><figcaption><span class="num">49</span>Context Bank</figcaption></figure><figure><button type="button" data-file="50-app-tour.jpg" aria-label="Open App tour"><img loading="lazy" src="light/50-app-tour.jpg" alt="App tour" width="1440" height="900"></button><figcaption><span class="num">50</span>App tour</figcaption></figure></div></section></main>
<dialog id="viewer">
  <div class="bar"><span id="viewerTitle"></span><div><button type="button" id="prev">Previous</button><button type="button" id="next">Next</button><button type="button" id="close">Close</button></div></div>
  <img id="viewerImg" alt="">
</dialog>
<script>
(function () {
  var theme = 'light', index = 0;
  var buttons = Array.prototype.slice.call(document.querySelectorAll('figure button'));
  var viewer = document.getElementById('viewer'), img = document.getElementById('viewerImg'), title = document.getElementById('viewerTitle');
  function show(i) {
    index = (i + buttons.length) % buttons.length;
    var b = buttons[index];
    img.src = theme + '/' + b.dataset.file;
    img.alt = b.querySelector('img').alt;
    title.textContent = b.dataset.file.slice(0, 2) + '  ' + img.alt;
  }
  function setTheme(t) {
    theme = t;
    document.documentElement.setAttribute('data-theme', t);
    document.querySelectorAll('.switch button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.theme === t)); });
    buttons.forEach(function (b) { b.querySelector('img').src = t + '/' + b.dataset.file; });
    if (viewer.open) show(index);
  }
  document.querySelectorAll('.switch button').forEach(function (b) { b.addEventListener('click', function () { setTheme(b.dataset.theme); }); });
  buttons.forEach(function (b, i) { b.addEventListener('click', function () { show(i); viewer.showModal(); }); });
  document.getElementById('prev').addEventListener('click', function () { show(index - 1); });
  document.getElementById('next').addEventListener('click', function () { show(index + 1); });
  document.getElementById('close').addEventListener('click', function () { viewer.close(); });
  viewer.addEventListener('click', function (e) { if (e.target === viewer) viewer.close(); });
  document.addEventListener('keydown', function (e) {
    if (!viewer.open) return;
    if (e.key === 'ArrowLeft') show(index - 1);
    if (e.key === 'ArrowRight') show(index + 1);
  });
})();
</script>
</body>
</html>
