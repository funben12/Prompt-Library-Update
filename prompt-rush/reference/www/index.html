<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4efe6">
<title>Prompt Builder Quest</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">PB</span>
      <span class="brand-name">Prompt Builder Quest</span>
    </div>
    <button class="btn-ghost" id="restartBtn" type="button" aria-label="Restart">Restart</button>
  </header>

  <main class="stage" id="stage">
    <section class="panel" id="panel" aria-live="polite"></section>
    <aside class="summary" id="summary" aria-label="Your agent so far"></aside>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="content.js"></script>
<script src="game.js"></script>
</body>
</html>
