          - paragraph [ref=f14e7439]: "Categories: Prompt Triangulation, Defensive Analysis, Blue Team Tags: blue-team, defensive-analysis, plan-defense, strength-articulation Used by: Military planning staffs, corporate strategy defenders, legal defense teams, policy advocates, proposal champions. What it is: A prompt that embodies the BLUE TEAM perspective — defending the plan, articulating its strengths, presenting the best case for why it will succeed, and responding to potential criticisms. It represents the plan's strongest possible defense. Why elite performers use it: A plan needs its best case articulated clearly, not just attacked. The Blue Team prompt ensures the plan's genuine strengths are fully developed and documented, preventing the triangulation from becoming purely negative. It also reveals where the defense is strong (high confidence) vs. weak (defensive arguments are strained). How to apply: Feed the plan or strategy into this prompt. Instruct the AI to be the plan's best advocate — not a balanced analyst, but a committed defender presenting the strongest possible case. Use this output as one input into the Red-Blue-Green Triangulator.x"
