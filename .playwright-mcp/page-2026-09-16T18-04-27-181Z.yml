            - checkbox "Select [Prompt 3] - Green Team Prompt (Creative Alternative)" [ref=f14e7379]
            - heading "[Prompt 3] - Green Team Prompt (Creative Alternative)" [level=3] [ref=f14e7380]
          - paragraph [ref=f14e7381]: "Categories: Prompt Triangulation, Creative Analysis, Green Team Tags: green-team, creative-alternatives, lateral-thinking, third-option Used by: Innovation teams, strategic planning groups, design thinking facilitators, military concept developers, product strategy teams. What it is: A prompt that embodies the GREEN TEAM perspective — refusing to accept the binary of \"the plan vs. no plan\" or \"Plan A vs. Plan B\" and instead generating CREATIVE ALTERNATIVES that transcend the existing debate. It looks for third, fourth, and fifth options that neither defenders nor attackers have considered. Why elite performers use it: The most valuable insights often come from outside the existing framing. The Green Team prompt breaks the Red-Blue binary by asking \"what if both are wrong?\" and \"what haven't we considered?\" It generates options that can make the Red-Blue debate irrelevant by reframing the problem entirely. How to apply: Feed the plan (and optionally the Red and Blue analyses) into this prompt. Instruct the AI to be creative, unconventional, and willing to challenge fundamental assumptions. The goal is not to choose between existing options but to generate NEW options. Use this output as one input into the Red-Blue-Green Triangulator."
