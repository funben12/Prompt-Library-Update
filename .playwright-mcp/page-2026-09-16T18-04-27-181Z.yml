          - paragraph [ref=f14e7468]: "Used by: Intelligence community red cells, military red teams, cybersecurity penetration testers, investment risk committees, devil's advocate reviewers. What it is: A prompt that embodies the RED TEAM perspective — actively trying to break the plan, find every weakness, play the intelligent adversary, and expose vulnerabilities that friendly review would miss. It assumes the plan will face a motivated, adaptive opponent. Why elite performers use it: Plans reviewed only by supporters are fragile. The Red Team prompt forces genuine adversarial thinking — not just \"what could go wrong\" but \"how would I defeat this plan if I were the opponent.\" It surfaces vulnerabilities that optimistic planning overlooks. How to apply: Feed the plan or strategy into this prompt. Instruct the AI to be merciless — this is not balanced analysis, it's adversarial attack. The output should make the plan's defenders uncomfortable. Use this output as one input into the Red-Blue-Green Triangulator."
