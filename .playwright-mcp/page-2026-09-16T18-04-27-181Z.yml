            - generic [ref=f14e3261]: star
          - paragraph [ref=f14e3262]: "Used by: Prompt library maintainers consolidating assets, enterprise teams merging overlapping prompts, anyone with prompt proliferation problems. What it is: A merge feasibility protocol that evaluates whether two prompts can be productively combined, and if so, determines the optimal merge strategy while resolving conflicts and eliminating duplication. Why elite performers use it: Prompt libraries tend to proliferate. This protocol provides a systematic approach to consolidation — knowing when to merge and when to keep separate. The merge feasibility scoring prevents forced, bad merges. How to apply: Use when your prompt library has grown to the point where you have multiple prompts addressing similar tasks. The \"keep separate with routing rule\" recommendation is just as valuable as a successful merge."
