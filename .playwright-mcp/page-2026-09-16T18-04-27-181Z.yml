            - generic [ref=f14e2835]: ★★★☆☆
          - paragraph [ref=f14e2836]: "Used by: Prompt engineers synthesizing best practices from multiple sources, AI product designers merging competing prompt strategies, creative prompt crafters seeking genuine novelty. What it is: A protocol that defines the elusive \"essence\" as the \"functional invariant\" — the specific cognitive operation both prompts are trying to trigger, independent of their surface techniques. This framing forces the analysis below technique to intent. Why this resolves your framing challenge: \"Logical and functional essence\" becomes \"the cognitive operation both prompts are trying to trigger.\" This is specific enough to guide synthesis and abstract enough to prevent banality. The gap analysis then identifies precisely what each prompt achieves and misses relative to this invariant, making the reconstruction targeted rather than generic. How to apply: Use when the two prompts share an obvious functional similarity but use different techniques. The invariant extraction is the critical step — if you get this wrong, the synthesis will be misaligned."
