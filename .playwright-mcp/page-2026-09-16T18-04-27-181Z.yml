            - generic [ref=f14e3287]: star
          - paragraph [ref=f14e3288]: "Used by: Prompt engineers exploring stylistic effects, creative prompt designers, researchers studying how style affects AI output quality, anyone stuck in a stylistic rut. What it is: A multi-style transfer protocol that rewrites a prompt in six radically different stylistic registers, with performance predictions for each — revealing whether the prompt's effectiveness is style-dependent or style-robust. Why elite performers use it: The same functional instructions, delivered in different styles, produce different outputs. This protocol systematically explores the stylistic possibility space, often discovering that a counterintuitive style (e.g., terse commands for creative tasks) outperforms the intuitive choice. How to apply: Run when you suspect your prompt's style might be suboptimal. The Socratic and Minimalist transfers are often surprisingly effective."
