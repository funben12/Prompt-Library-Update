            - heading "The Meta Prompt Framework Generator" [level=3] [ref=f14e7351]
          - paragraph [ref=f14e7352]: "**Used by:** Enterprise AI platform architects, prompt engineering team leads, management consultants productizing analytical methodologies, AI product designers building prompt-generation systems, knowledge management specialists. **What it is:** A meta-prompt that designs and generates COMPLETE PROMPT FRAMEWORKS — structured, reusable prompt templates that encode a specific analytical methodology, decision process, or knowledge domain. It takes a description of what you want the framework to accomplish and produces a fully-parameterized prompt framework that can be used repeatedly across different contexts. **Why elite performers use it:** Writing individual prompts doesn't scale. Elite performers build prompt frameworks — reusable templates that encode best practices, analytical rigor, and domain expertise into a standardized format. This meta-prompt automates the framework creation process, ensuring consistency across an organization's prompt library and dramatically reducing the time from methodology identification to deployment-ready prompt system. **How to apply:** Define the purpose of your framework clearly — what problem does it solve, for whom, under what conditions? The meta-prompt will generate a complete framework including: the governing logic, the prompt architecture, variable parameters, usage guidance, and example instantiations. Review the generated framework, test it with real inputs, and refine based on empirical performance. Once validated, the framework becomes a permanent asset in your prompt library."
