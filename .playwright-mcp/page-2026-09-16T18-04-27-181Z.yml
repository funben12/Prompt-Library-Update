            - generic [ref=f14e2809]: ★★★★★
          - paragraph [ref=f14e2810]: "Used by: Creative prompt engineers designing novel AI capabilities, researchers combining reasoning paradigms, enterprise teams merging internal prompt libraries. What it is: A symbiosis-focused protocol that defines \"essence\" as \"the unifying principle\" — the deeper purpose that makes both originals obsolete. The fusion constraint forbids simple sequencing, forcing genuine architectural innovation. Why this resolves your framing challenge: \"Underlying principle\" becomes \"the deeper purpose that would make both originals obsolete.\" This is aspirational enough to drive creativity but anchored enough in the originals' strengths and gaps to prevent excess. The final test — \"what can this do that no sequence of the originals could?\" — is the anti-banality check. How to apply: Use when the two prompts are genuinely complementary (each has a strength the other lacks) rather than merely different. The symbiosis analysis before synthesis ensures you're not forcing a fusion where one prompt is simply better."
