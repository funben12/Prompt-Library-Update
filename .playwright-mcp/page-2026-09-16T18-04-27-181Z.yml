            - checkbox "Select [The Main Prompt] - Red-Blue-Green Team Triangulator" [ref=f14e7408]
            - heading "[The Main Prompt] - Red-Blue-Green Team Triangulator" [level=3] [ref=f14e7409]
          - paragraph [ref=f14e7410]: "Categories: Prompt Triangulation, Adversarial Analysis, Alternative Analysis Tags: red-team, blue-team, green-team, adversarial-triangulation, devil's-advocate Used by: Intelligence community alternative analysis cells, military red teams, cybersecurity penetration testing teams, investment risk committees, strategic planning groups. What it is: A meta-prompt that orchestrates a structured TRIANGULATION between three teams: RED (adversarial — tries to break the plan, finds weaknesses, plays the opponent), BLUE (defensive — defends the current plan, presents the best case for it), and GREEN (neutral/creative — proposes alternative approaches neither Red nor Blue considered). The synthesis identifies where the plan survives attack, where it fails, and what better options exist. Why elite performers use it: Plans that survive only friendly review are fragile. Plans that survive adversarial attack are robust. The Red-Blue-Green triangulation creates productive, structured conflict — Red exposes vulnerabilities, Blue defends what's worth keeping, Green breaks the Red-Blue binary with creative alternatives. Elite performers use this before committing to irreversible courses of action. How to apply: Run three separate prompts: one as Red Team (adversarial), one as Blue Team (defensive), one as Green Team (creative alternative). Feed all three into this triangulator. The synthesis will identify vulnerabilities the Blue Team missed, strengths the Red Team had to concede, and alternatives that transcend the Red-Blue debate. The final output is a hardened plan that has survived adversarial scrutiny."
