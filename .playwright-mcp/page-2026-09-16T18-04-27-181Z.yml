            - heading "The Prompt Ablation Analyzer" [level=3] [ref=f14e3034]
          - paragraph [ref=f14e3035]: "Used by: AI researchers studying prompt effectiveness, enterprise prompt optimization teams, frontier model evaluation engineers. What it is: A protocol that systematically REMOVES individual components from a prompt to measure their contribution to overall performance — identifying which elements are load-bearing, which are supportive, and which are decorative or even harmful. Based on the scientific method of ablation studies. Why elite performers use it: Most prompt refinement is additive — engineers keep adding elements hoping something helps. Ablation is subtractive — it identifies what actually matters by removing things and measuring the impact. This reveals that many prompt elements contribute nothing or actively harm performance. Elite performers use this to strip prompts down to their essential core, then build back only what's proven necessary. How to apply: Run this on prompts that have grown through accretion — especially those that have been modified by multiple people over time. The protocol requires systematic testing: each component must be removed in isolation and tested against a consistent set of inputs. The \"component classification\" output (Step 3) is the most actionable — it tells you exactly what to keep, what to consider removing, and what to remove immediately. Be prepared for surprises: components that everyone believed were essential often prove to be decorative or even harmful."
