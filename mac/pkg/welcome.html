<h1>Prompt Library Pro</h1>
<p>This installer puts <b>Prompt Library Pro</b> in your <b>Applications</b> folder.</p>
<ul>
<li>Your prompts are stored on this Mac, in <code>Documents/PromptLibrary</code>. Nothing is uploaded.</li>
<li>Updating? Your existing library is kept. Installing never touches it.</li>
</ul>
<p>Click <b>Continue</b> to install.</p>
