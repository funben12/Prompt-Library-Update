<div id="contextBankWorkspace" role="dialog" aria-modal="true" aria-label="Context Bank">
  <div class="ws-header">
    <div class="ws-header-left">
      <span class="material-symbols-outlined ws-header-icon">database</span>
      <div>
        <h2 class="ws-title">Context Bank</h2>
        <p class="ws-subtitle">Reusable context blocks — paste into any prompt instantly.</p>
      </div>
    </div>
    <div class="ws-header-actions">
      <button class="btn btn-accent" id="ctxNewBtn">
        <span class="material-symbols-outlined">add</span> New block
      </button>
      <button class="icon-btn" id="closeContextBankBtn" aria-label="Close Context Bank">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
  </div>

  <div class="ws-body ctx-body">

    <!-- Left: list panel -->
    <div class="ctx-list-panel">
      <!-- Search -->
      <div class="ctx-search-row">
        <span class="material-symbols-outlined ctx-search-icon">search</span>
        <input type="search" id="ctxSearch" class="ctx-search-input" placeholder="Search blocks…" autocomplete="off" />
      </div>

      <!-- Category pills -->
      <div class="ctx-cat-row" id="ctxCategoryRow">
        <button class="ctx-pill active" data-ctx-filter="all">All</button>
        <button class="ctx-pill" data-ctx-filter="Persona">Persona</button>
        <button class="ctx-pill" data-ctx-filter="Company">Company</button>
        <button class="ctx-pill" data-ctx-filter="Audience">Audience</button>
        <button class="ctx-pill" data-ctx-filter="Product">Product</button>
        <button class="ctx-pill" data-ctx-filter="Style">Style</button>
        <button class="ctx-pill" data-ctx-filter="Other">Other</button>
      </div>

      <!-- Stats row -->
      <div class="ctx-meta-row">
        <span class="ctx-meta-stat"><span id="ctxStatBlocks">0</span> blocks</span>
        <span class="ctx-meta-sep">·</span>
        <span class="ctx-meta-stat"><span id="ctxStatCats">0</span> categories</span>
      </div>

      <!-- Block list -->
      <div class="ctx-list" id="ctxList">
        <div class="ctx-empty" id="ctxEmptyHint">
          <span class="material-symbols-outlined">inventory_2</span>
          <p>No blocks yet.<br>Click <strong>New block</strong> to start.</p>
        </div>
      </div>
    </div>

    <!-- Right: editor panel -->
    <div class="ctx-editor-panel" id="ctxEditorPanel">
      <!-- Empty state -->
      <div class="ctx-editor-empty" id="ctxEditorEmpty">
        <span class="material-symbols-outlined">touch_app</span>
        <p>Select a block to edit<br>or click <strong>New block</strong></p>
      </div>

      <!-- Form -->
      <div class="ctx-editor-form" id="ctxEditorForm" hidden>
        <div class="ctx-editor-top">
          <span class="ctx-editor-eyebrow" id="ctxEditorHeading">New block</span>
        </div>
        <div class="ctx-editor-scroll">
          <div class="ctx-field">
            <label class="ctx-label">Title <span class="ctx-req">*</span></label>
            <input type="text" id="ctxTitle" class="ctx-input" placeholder="e.g. ACME Corp — Company Overview" />
          </div>
          <div class="ctx-field">
            <label class="ctx-label">Category</label>
            <select id="ctxCategory" class="ctx-input ctx-select">
              <option>Persona</option>
              <option>Company</option>
              <option>Audience</option>
              <option>Product</option>
              <option>Style</option>
              <option>Other</option>
            </select>
          </div>
          <div class="ctx-field ctx-field-grow">
            <label class="ctx-label">
              Content <span class="ctx-req">*</span>
              <span class="ctx-label-hint">This text gets copied into your prompt</span>
            </label>
            <textarea id="ctxContent" class="ctx-textarea" rows="14"
              placeholder="Write your reusable context block here…&#10;&#10;e.g.&#10;Company: ACME Corp&#10;Industry: SaaS — B2B project management&#10;Tone: Professional but approachable&#10;Audience: Non-technical SMB owners aged 30–55&#10;Key differentiator: Simplicity over feature depth"></textarea>
          </div>
          <div class="ctx-save-confirm" id="ctxSaveConfirm">&#10003; Saved</div>
        </div>
        <div class="ctx-editor-footer">
          <button class="btn btn-accent" id="ctxSaveBtn">
            <span class="material-symbols-outlined">save</span> Save
          </button>
          <button class="btn btn-ghost" id="ctxCopyBtn">
            <span class="material-symbols-outlined">content_copy</span> Copy
          </button>
          <button class="btn btn-ghost ctx-delete-btn" id="ctxDeleteBtn" style="margin-left:auto">
            <span class="material-symbols-outlined">delete</span>
          </button>
        </div>
      </div>
    </div>

  </div>
</div>
