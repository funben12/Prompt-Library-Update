<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutorial coachmark card — reference</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=JetBrains+Mono:wght@100..800&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="../_shared/shared.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="tutorialCard" role="dialog" aria-label="Tutorial step" aria-modal="true">
  <div class="tour-progress" id="tourProgress"></div>
  <div class="tour-card-body">
    <div class="tour-icon" id="tourIcon"></div>
    <h3 class="tour-title" id="tourTitle"></h3>
    <div class="tour-body" id="tourBody"></div>
  </div>
  <div class="tour-footer">
    <button class="btn btn-ghost tour-skip" id="tourSkipBtn" onclick="window.PL_endTutorial()">Skip tour</button>
    <div class="tour-nav">
      <button class="btn btn-ghost tour-back" id="tourBackBtn" onclick="window.PL_tutorialBack()">
        <span class="material-symbols-outlined">arrow_back</span> Back
      </button>
      <button class="btn btn-accent tour-next" id="tourNextBtn" onclick="window.PL_tutorialNext()">
        Next <span class="material-symbols-outlined">arrow_forward</span>
      </button>
    </div>
  </div>
  <div class="tour-arrow" id="tourArrow"></div>
</div>

<!-- Preview shim: workspaces are hidden until .open is set by the app. Force it visible. -->
<script>
(function () {
  var root = document.body.firstElementChild;
  if (!root) return;
  root.classList.add('open', 'active', 'visible');
  root.removeAttribute('hidden');
  root.removeAttribute('aria-hidden');
  root.style.display = '';
  root.style.opacity = '1';
  root.style.visibility = 'visible';
  root.style.transform = 'none';
  root.style.pointerEvents = 'auto';
})();
</script>

<!-- Extracted logic. Expect console errors here: these functions were cut out of the
     app.js IIFE and still expect state, api() and the rest of the app around them.
     Preview is for layout and styling, not for running the feature. -->
<script src="../_shared/shared.js"></script>
<script src="script.js"></script>
</body>
</html>
