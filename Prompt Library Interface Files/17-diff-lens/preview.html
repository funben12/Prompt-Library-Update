<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diff Lens — reference</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=JetBrains+Mono:wght@100..800&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="../_shared/shared.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="diffWorkspace" role="dialog" aria-modal="true" aria-label="Diff Lens">
  <div class="ws-header">
    <div class="ws-header-left">
      <span class="material-symbols-outlined ws-header-icon">compare</span>
      <div>
        <h2 class="ws-title">Diff Lens</h2>
        <p class="ws-subtitle">Compare two prompts word by word. Spot exactly what changed.</p>
      </div>
    </div>
    <div class="ws-header-actions">
      <button class="btn btn-ghost" id="diffSwapBtn"><span class="material-symbols-outlined">swap_horiz</span> Swap</button>
      <button class="btn btn-accent" id="diffRunBtn"><span class="material-symbols-outlined">compare</span> Compare</button>
      <button class="icon-btn" id="closeDiffBtn" aria-label="Close Diff Lens"><span class="material-symbols-outlined">close</span></button>
    </div>
  </div>
  <div class="ws-body dif-body">
    <div class="dif-inputs">
      <div class="dif-col">
        <div class="opt-section-label">Version A</div>
        <select id="diffPickerA" class="forge-input qf-picker"><option value="">Load from library…</option></select>
        <textarea id="diffInputA" class="forge-input" rows="8" placeholder="Paste version A…"></textarea>
      </div>
      <div class="dif-col">
        <div class="opt-section-label">Version B</div>
        <select id="diffPickerB" class="forge-input qf-picker"><option value="">Load from library…</option></select>
        <textarea id="diffInputB" class="forge-input" rows="8" placeholder="Paste version B…"></textarea>
      </div>
    </div>
    <div class="dif-stats" id="diffStats"></div>
    <div class="opt-output dif-output" id="diffOutput"><span class="hint">Removed words show struck out, added words highlighted.</span></div>
  </div>
</div>

<!-- Preview shim: workspaces are hidden until .open is set by the app. Force it visible. -->
<script>
(function () {
  var root = document.body.firstElementChild;
  if (!root) return;
  root.classList.add('open', 'active', 'visible');
  root.removeAttribute('hidden');
  root.removeAttribute('aria-hidden');
  root.style.display = '';
  root.style.opacity = '1';
  root.style.visibility = 'visible';
  root.style.transform = 'none';
  root.style.pointerEvents = 'auto';
})();
</script>

<!-- Extracted logic. Expect console errors here: these functions were cut out of the
     app.js IIFE and still expect state, api() and the rest of the app around them.
     Preview is for layout and styling, not for running the feature. -->
<script src="../_shared/shared.js"></script>
<script src="script.js"></script>
</body>
</html>
