<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Fill — reference</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=JetBrains+Mono:wght@100..800&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="../_shared/shared.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="fillWorkspace" role="dialog" aria-modal="true" aria-label="Quick Fill">
  <div class="ws-header">
    <div class="ws-header-left">
      <span class="material-symbols-outlined ws-header-icon">dynamic_form</span>
      <div>
        <h2 class="ws-title">Quick Fill</h2>
        <p class="ws-subtitle">Pick a template, fill its placeholders, copy the finished prompt.</p>
      </div>
    </div>
    <div class="ws-header-actions">
      <button class="btn btn-ghost" id="qfClearBtn"><span class="material-symbols-outlined">restart_alt</span> Clear</button>
      <button class="btn btn-ghost" id="qfCopyBtn"><span class="material-symbols-outlined">content_copy</span> Copy</button>
      <button class="btn btn-accent" id="qfSaveBtn"><span class="material-symbols-outlined">save</span> Save as new</button>
      <button class="icon-btn" id="closeFillBtn" aria-label="Close Quick Fill"><span class="material-symbols-outlined">close</span></button>
    </div>
  </div>
  <div class="ws-body qf-body">
    <div class="qf-left">
      <div class="opt-section-label">Template</div>
      <select id="qfPicker" class="forge-input qf-picker"><option value="">Load from library…</option></select>
      <textarea id="qfSource" class="forge-input" rows="8" placeholder="…or paste a template here. Placeholders like [audience] or {{product}} become form fields."></textarea>
      <div class="opt-section-label" style="margin-top:var(--sp-3);">Placeholders <span class="qf-count-chip" id="qfVarCount">0</span></div>
      <div class="qf-var-list" id="qfVarList">
        <div class="qf-empty">No placeholders found yet.</div>
      </div>
    </div>
    <div class="qf-right">
      <div class="opt-section-label">Result <span class="qf-fill-stat" id="qfFillStat"></span></div>
      <div class="opt-output qf-preview" id="qfPreview"><span class="hint">Pick a prompt or paste a template on the left…</span></div>
    </div>
  </div>
</div>

<!-- Preview shim: workspaces are hidden until .open is set by the app. Force it visible. -->
<script>
(function () {
  var root = document.body.firstElementChild;
  if (!root) return;
  root.classList.add('open', 'active', 'visible');
  root.removeAttribute('hidden');
  root.removeAttribute('aria-hidden');
  root.style.display = '';
  root.style.opacity = '1';
  root.style.visibility = 'visible';
  root.style.transform = 'none';
  root.style.pointerEvents = 'auto';
})();
</script>

<!-- Extracted logic. Expect console errors here: these functions were cut out of the
     app.js IIFE and still expect state, api() and the rest of the app around them.
     Preview is for layout and styling, not for running the feature. -->
<script src="../_shared/shared.js"></script>
<script src="script.js"></script>
</body>
</html>
