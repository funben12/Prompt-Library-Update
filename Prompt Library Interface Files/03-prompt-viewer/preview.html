<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt viewer overlay — reference</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=JetBrains+Mono:wght@100..800&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="../_shared/shared.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="promptViewer" aria-modal="true" aria-label="Prompt viewer" role="dialog">
  <div class="pv-header">
    <button class="pv-back-btn" id="pvCloseBtn" title="Back to library">
      <span class="material-symbols-outlined">arrow_back</span>
      Back
    </button>
    <div class="pv-header-title" id="pvTitle"></div>
    <div class="pv-header-chips" id="pvChips"></div>
    <button class="icon-btn" id="pvEditBtn" title="Edit prompt">
      <span class="material-symbols-outlined">edit</span>
    </button>
    <button class="icon-btn" id="pvFavBtn" title="Toggle favourite">
      <span class="material-symbols-outlined">favorite</span>
    </button>
  </div>
  <div class="pv-body">
    <div class="pv-main">
      <div class="pv-desc" id="pvDesc" hidden></div>
      <div>
        <div class="pv-prompt-label">
          <span class="material-symbols-outlined" style="font-size:14px">code</span>
          Prompt
        </div>
        <div class="pv-prompt-block" id="pvPromptBlock"></div>
      </div>
      <div class="pv-meta-strip" id="pvMetaStrip"></div>
    </div>
    <aside class="pv-sidebar">
      <div>
        <div class="pv-section-label">Actions</div>
        <button class="btn btn-accent pv-copy-btn" id="pvCopyBtn">
          <span class="material-symbols-outlined">content_copy</span>
          Copy to clipboard
        </button>
      </div>
      <div id="pvVarSection" hidden>
        <div class="pv-section-label">Fill variables</div>
        <div class="pv-var-fields" id="pvVarFields"></div>
        <button class="btn btn-primary pv-copy-btn" id="pvCopyFilledBtn" style="margin-top:8px;">
          <span class="material-symbols-outlined">content_copy</span>
          Copy filled prompt
        </button>
      </div>
      <div id="pvTagsSection" hidden>
        <div class="pv-section-label">Tags</div>
        <div id="pvTags" style="display:flex;flex-wrap:wrap;gap:4px;"></div>
      </div>
    </aside>
  </div>
</div>

<!-- Preview shim: workspaces are hidden until .open is set by the app. Force it visible. -->
<script>
(function () {
  var root = document.body.firstElementChild;
  if (!root) return;
  root.classList.add('open', 'active', 'visible');
  root.removeAttribute('hidden');
  root.removeAttribute('aria-hidden');
  root.style.display = '';
  root.style.opacity = '1';
  root.style.visibility = 'visible';
  root.style.transform = 'none';
  root.style.pointerEvents = 'auto';
})();
</script>

<!-- Extracted logic. Expect console errors here: these functions were cut out of the
     app.js IIFE and still expect state, api() and the rest of the app around them.
     Preview is for layout and styling, not for running the feature. -->
<script src="../_shared/shared.js"></script>
<script src="script.js"></script>
</body>
</html>
