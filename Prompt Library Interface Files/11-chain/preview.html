<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Chain — reference</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=JetBrains+Mono:wght@100..800&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="../_shared/shared.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="chainWorkspace" role="dialog" aria-modal="true" aria-label="Prompt Chain">
  <div class="ws-header">
    <div class="ws-header-left">
      <span class="material-symbols-outlined ws-header-icon">account_tree</span>
      <div>
        <h2 class="ws-title">Prompt Chain</h2>
        <p class="ws-subtitle">Build a sequence of steps. Each step's output feeds the next as <code>{{input}}</code>.</p>
      </div>
    </div>
    <div class="ws-header-actions">
      <button class="btn btn-ghost" id="chainAddStepBtn"><span class="material-symbols-outlined">add</span> Add Step</button>
      <button class="btn btn-ghost" id="chainClearBtn"><span class="material-symbols-outlined">restart_alt</span> Clear</button>
      <button class="btn btn-ghost" id="chainAssembleBtn"><span class="material-symbols-outlined">read_more</span> Assemble</button>
      <button class="btn btn-accent" id="chainSaveBtn"><span class="material-symbols-outlined">save</span> Save Chain</button>
      <button class="icon-btn" id="closeChainBtn" aria-label="Close Chain"><span class="material-symbols-outlined">close</span></button>
    </div>
  </div>
  <div class="ws-body chain-body">
    <!-- Step 0: Seed input -->
    <div class="chain-seed" id="chainSeedWrap">
      <div class="chain-seed-label">
        <span class="material-symbols-outlined">input</span>
        Initial Input
        <span class="forge-hint" style="font-weight:400;color:var(--ink-3);">Passed into Step 1 as <code>{{input}}</code></span>
      </div>
      <textarea id="chainSeedInput" class="forge-input" rows="3" placeholder="Paste the raw material — a document, a brief, a question — that starts the chain..."></textarea>
    </div>
    <!-- Steps rendered by JS -->
    <div class="chain-steps-wrap">
      <div id="chainStepsList" class="chain-steps-list"></div>
      <button class="chain-add-inline" id="chainAddInlineBtn" type="button">
        <span class="material-symbols-outlined">add_circle</span> Add Step
      </button>
    </div>
    <!-- Assembly preview panel (slides up from bottom) -->
    <div class="chain-preview-panel collapsed" id="chainPreviewPanel">
      <div class="chain-preview-header">
        <span class="material-symbols-outlined">read_more</span>
        Assembled Chain
        <button class="icon-btn" id="chainPreviewCloseBtn" title="Collapse" aria-label="Collapse preview">
          <span class="material-symbols-outlined">expand_more</span>
        </button>
      </div>
      <div class="chain-preview-body">
        <textarea id="chainPreviewText" class="chain-preview-ta" readonly placeholder="Click Assemble to preview the full prompt..."></textarea>
        <div class="chain-preview-actions">
          <button class="btn btn-ghost btn-sm" id="chainPreviewCopyBtn">
            <span class="material-symbols-outlined">content_copy</span> Copy
          </button>
          <button class="btn btn-accent btn-sm" id="chainPreviewSaveBtn">
            <span class="material-symbols-outlined">save</span> Save to Library
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Preview shim: workspaces are hidden until .open is set by the app. Force it visible. -->
<script>
(function () {
  var root = document.body.firstElementChild;
  if (!root) return;
  root.classList.add('open', 'active', 'visible');
  root.removeAttribute('hidden');
  root.removeAttribute('aria-hidden');
  root.style.display = '';
  root.style.opacity = '1';
  root.style.visibility = 'visible';
  root.style.transform = 'none';
  root.style.pointerEvents = 'auto';
})();
</script>

<!-- Extracted logic. Expect console errors here: these functions were cut out of the
     app.js IIFE and still expect state, api() and the rest of the app around them.
     Preview is for layout and styling, not for running the feature. -->
<script src="../_shared/shared.js"></script>
<script src="script.js"></script>
</body>
</html>
