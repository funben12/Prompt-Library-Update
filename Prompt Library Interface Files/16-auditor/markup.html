<div id="auditWorkspace" role="dialog" aria-modal="true" aria-label="Prompt Auditor">
  <div class="ws-header">
    <div class="ws-header-left">
      <span class="material-symbols-outlined ws-header-icon">fact_check</span>
      <div>
        <h2 class="ws-title">Prompt Auditor</h2>
        <p class="ws-subtitle">Grade a prompt against the fundamentals. Instant, on-device.</p>
      </div>
    </div>
    <div class="ws-header-actions">
      <button class="icon-btn" id="closeAuditBtn" aria-label="Close Prompt Auditor"><span class="material-symbols-outlined">close</span></button>
    </div>
  </div>
  <div class="ws-body aud-body">
    <div class="aud-left">
      <div class="opt-section-label">Prompt</div>
      <select id="audPicker" class="forge-input qf-picker"><option value="">Load from library…</option></select>
      <textarea id="audInput" class="forge-input" rows="10" placeholder="Paste the prompt to audit…"></textarea>
      <div class="opt-actions" style="margin-top:var(--sp-3);">
        <button class="btn btn-accent" id="audRunBtn"><span class="material-symbols-outlined">fact_check</span> Audit</button>
        <button class="btn btn-ghost" id="audAiBtn" title="Needs an API key in Settings"><span class="material-symbols-outlined">psychology</span> AI Deep Critique</button>
      </div>
      <div class="opt-output" id="audAiOutput" style="display:none;margin-top:var(--sp-3);"></div>
    </div>
    <div class="aud-right" id="audResults" style="display:none;">
      <div class="aud-score-row">
        <div class="aud-score"><span id="audScoreNum">0</span><span class="aud-score-max">/100</span></div>
        <div>
          <span class="aud-badge" id="audScoreBadge">—</span>
          <div class="aud-meta" id="audMeta"></div>
        </div>
      </div>
      <div class="opt-section-label" style="margin-top:var(--sp-3);">Dimensions</div>
      <div id="audDims"></div>
      <div class="opt-section-label" style="margin-top:var(--sp-3);">Findings</div>
      <div id="audFindings"></div>
      <div class="opt-actions" style="margin-top:var(--sp-3);">
        <button class="btn btn-accent" id="audSaveBtn"><span class="material-symbols-outlined">save</span> Save to Library</button>
      </div>
    </div>
  </div>
</div>
