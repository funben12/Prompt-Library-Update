<div id="cmdPalette" role="dialog" aria-modal="true" aria-label="Command palette">
  <div class="cmd-box">
    <div class="cmd-input-row">
      <span class="material-symbols-outlined">search</span>
      <input type="text" id="cmdInput" placeholder="Search prompts or type a command..." />
      <span class="cmd-pro-badge">PRO</span>
      <span class="cmd-kbd">Esc</span>
    </div>
    <div class="cmd-results" id="cmdResults"></div>
    <div class="cmd-footer">
      <span><span class="cmd-kbd">Up Down</span> Navigate</span>
      <span><span class="cmd-kbd">Enter</span> Open</span>
      <span><span class="cmd-kbd">Ctrl+K</span> Toggle</span>
    </div>
  </div>
</div>
