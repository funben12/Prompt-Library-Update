<div id="forgeWorkspace" role="dialog" aria-modal="true" aria-label="Prompt Forge">

      <div>

      </div>

    </div>
  </div>

  <div class="ws-body forge-body">
    <div class="forge-form">
      <div id="forgeFields"><!-- Rendered by JS based on active framework --></div>
      <div class="forge-meta-row">
        <div class="forge-meta-group">
          <label class="forge-meta-label" for="forgeTitleInput">Prompt title</label>
          <input type="text" id="forgeTitleInput" class="form-input" placeholder="Give this prompt a name to save it..." />
        </div>
        <div class="forge-meta-group">
          <label class="forge-meta-label" for="forgeToneSelect">Tone</label>
          <select id="forgeToneSelect" class="form-input">
            <option value="">— Not specified —</option>
            <option>Professional</option><option>Conversational</option><option>Direct</option>
            <option>Friendly</option><option>Formal</option><option>Concise</option><option>Analytical</option>
          </select>
        </div>
      </div>
    </div>
    <div class="forge-preview">
      <div class="forge-preview-header">
        <span class="forge-preview-title">Assembled prompt</span>
        <div class="forge-preview-controls">
          <div class="forge-format-tabs" id="forgeFormatTabs">
            <button class="forge-format-tab active" data-format="markdown" title="Markdown headings">MD</button>
            <button class="forge-format-tab" data-format="plain" title="Plain text">TXT</button>
            <button class="forge-format-tab" data-format="xml" title="XML tags">XML</button>
          </div>
          <span id="forgeTokenCount" class="forge-char-count">~0 tokens</span>
          <span id="forgeCharCount" class="forge-char-count">0 chars</span>
          <button class="btn btn-ghost btn-sm" id="forgeCopyBtn"><span class="material-symbols-outlined">content_copy</span> Copy</button>
        </div>
      </div>
      <div class="forge-quality-bar-wrap">
        <div class="forge-quality-track">
          <div class="forge-quality-bar" id="forgeQualityBar"></div>
        </div>
        <span class="forge-quality-label" id="forgeQualityLabel">Completeness: 0%</span>
      </div>
      <div id="forgeOutput" class="forge-output"><span class="hint">Fill in the fields on the left — your assembled prompt appears here live.</span></div>
    </div>
