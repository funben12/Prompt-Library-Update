<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt X-Ray — reference</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=JetBrains+Mono:wght@100..800&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="../_shared/shared.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="xrayWorkspace" role="dialog" aria-modal="true" aria-label="Prompt X-Ray">
  <div class="ws-header">
    <div class="ws-header-left">
      <span class="material-symbols-outlined ws-header-icon">visibility</span>
      <div>
        <h2 class="ws-title">Prompt X-Ray</h2>
        <p class="ws-subtitle">See inside any prompt — role, context, task, constraints, format.</p>
      </div>
    </div>
    <div class="ws-header-actions">
      <button class="icon-btn" id="closeXrayBtn" aria-label="Close Prompt X-Ray"><span class="material-symbols-outlined">close</span></button>
    </div>
  </div>
  <div class="ws-body xr-body">
    <div class="xr-left">
      <div class="opt-section-label">Prompt</div>
      <select id="xrayPicker" class="forge-input qf-picker"><option value="">Load from library…</option></select>
      <textarea id="xrayInput" class="forge-input" rows="10" placeholder="Paste any prompt to deconstruct…"></textarea>
      <div class="opt-actions" style="margin-top:var(--sp-3);">
        <button class="btn btn-accent" id="xrayRunBtn"><span class="material-symbols-outlined">visibility</span> Deconstruct</button>
      </div>
    </div>
    <div class="xr-right">
      <div class="xr-grid" id="xrayGrid">
        <div class="hint" style="padding:var(--sp-4);">Components appear here after deconstruction. Edit any section, then copy or save the rebuilt prompt.</div>
      </div>
      <div class="opt-actions" id="xrayActions" style="display:none;margin-top:var(--sp-3);">
        <button class="btn btn-ghost" id="xrayCopyBtn"><span class="material-symbols-outlined">content_copy</span> Copy structured</button>
        <button class="btn btn-accent" id="xraySaveBtn"><span class="material-symbols-outlined">save</span> Save to Library</button>
      </div>
    </div>
  </div>
</div>

<!-- Preview shim: workspaces are hidden until .open is set by the app. Force it visible. -->
<script>
(function () {
  var root = document.body.firstElementChild;
  if (!root) return;
  root.classList.add('open', 'active', 'visible');
  root.removeAttribute('hidden');
  root.removeAttribute('aria-hidden');
  root.style.display = '';
  root.style.opacity = '1';
  root.style.visibility = 'visible';
  root.style.transform = 'none';
  root.style.pointerEvents = 'auto';
})();
</script>

<!-- Extracted logic. Expect console errors here: these functions were cut out of the
     app.js IIFE and still expect state, api() and the rest of the app around them.
     Preview is for layout and styling, not for running the feature. -->
<script src="../_shared/shared.js"></script>
<script src="script.js"></script>
</body>
</html>
